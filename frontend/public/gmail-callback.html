<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="referrer" content="no-referrer"><title>Connexion Gmail</title></head>
  <body style="font-family:system-ui,sans-serif;display:grid;min-height:100vh;place-items:center;margin:0;background:#fbf9f7;color:#1c1917">
    <main style="max-width:420px;padding:24px;text-align:center"><h1>Connexion Gmail</h1><p id="status">Vérification de l’autorisation…</p><a href="/">Revenir à Marrakech Career</a></main>
    <script>
      const result = new URLSearchParams(window.location.search).get('status');
      const connected = result === 'connected';
      document.getElementById('status').textContent = connected ? 'Gmail connecté. Vous pouvez revenir à votre candidature.' : 'Connexion non autorisée ou expirée. Revenez à votre candidature et réessayez.';
      window.history.replaceState({}, '', window.location.pathname);
      if (window.opener) {
        window.opener.postMessage({ type: 'mc-gmail-connected', status: connected ? 'connected' : 'error' }, window.location.origin);
      }
      window.close();
    </script>
  </body>
</html>
