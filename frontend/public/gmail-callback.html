<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion Gmail</title>
  </head>
  <body style="font-family:system-ui,sans-serif;display:grid;min-height:100vh;place-items:center;margin:0;background:#fbf9f7;color:#1c1917">
    <p id="status">Enregistrement sécurisé de Gmail…</p>
    <script>
      (async function () {
        const params = new URLSearchParams(window.location.hash.slice(1));
        const accessToken = params.get('access_token');
        const refreshToken = params.get('provider_refresh_token');
        const email = params.get('email');
        const status = document.getElementById('status');
        if (!accessToken || !refreshToken) {
          status.textContent = 'Google n’a pas fourni l’autorisation permanente. Revenez dans Marrakech Career et reconnectez Gmail.';
          return;
        }
        try {
          const response = await fetch('https://rometmtcpaoggerucisc.supabase.co/functions/v1/save-gmail-connection', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
            body: JSON.stringify({
              email: email || 'marrakechcareer@gmail.com',
              refreshToken,
              scopes: ['https://www.googleapis.com/auth/gmail.send'],
            }),
          });
          if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || 'Erreur serveur Gmail');
          window.location.replace('/?gmail=connected');
        } catch (error) {
          status.textContent = 'Connexion Gmail impossible : ' + (error instanceof Error ? error.message : 'erreur inconnue');
        }
      })();
    </script>
  </body>
</html>
